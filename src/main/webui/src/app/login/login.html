<div class="page login-page">
  <article class="sheet sheet--hero login-sheet">
    <span class="login-mark"><app-logo [size]="64" /></span>
    <h1>Grosz do Grosza</h1>
    <p class="subtitle">{{ 'login.subtitle' | translate }}</p>
    <button type="button" class="btn btn--primary btn--block" (click)="login()">
      <mat-icon>login</mat-icon>{{ 'login.submit' | translate }}
    </button>
    <a class="how-link" routerLink="/jak-to-dziala">{{ 'publicOverview.howItWorksLink' | translate }}</a>
  </article>
</div>
