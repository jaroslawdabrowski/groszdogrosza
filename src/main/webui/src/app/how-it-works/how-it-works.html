<div class="page">
  <a class="back-link" routerLink="/">
    <mat-icon>arrow_back</mat-icon>{{ 'nav.start' | translate }}
  </a>

  <header class="page-head">
    <h1>{{ 'howItWorks.title' | translate }}</h1>
    <p class="intro">{{ 'howItWorks.intro' | translate }}</p>
  </header>

  <article class="sheet explainer">
    @for (topic of topics; track topic.key) {
      <section class="topic">
        <span class="list-icon" [class]="'list-icon list-icon--' + topic.tone" aria-hidden="true"><mat-icon>{{ topic.icon }}</mat-icon></span>
        <div class="topic-text">
          <h2>{{ ('howItWorks.' + topic.key + 'Title') | translate }}</h2>
          <p>{{ ('howItWorks.' + topic.key + 'Body') | translate }}</p>
        </div>
      </section>
    }
  </article>
</div>
