# Quinoa: use the system node/npm on PATH instead of downloading a pinned version
quarkus.quinoa.package-manager-install=false
quarkus.quinoa.enable-spa-routing=true

# Quinoa serves the built Angular app (index.html, i18n/*.json, the JS/CSS bundles) via
# Quarkus's generic static-resources handler, which defaults to Cache-Control: public,
# immutable, max-age=86400 for every file it serves - fine for the JS/CSS bundles (Angular
# content-hashes their filenames, so a new build is a new URL) but wrong for index.html and
# i18n/*.json, whose URLs never change across deploys: "immutable" tells the browser not to
# even revalidate on a normal refresh, so a deploy's translation changes wouldn't show up for
# up to 24h. There's no per-path override for this config, so caching is disabled outright -
# an acceptable tradeoff at this app's traffic (one school class), and the only way to
# guarantee every refresh always gets the current deploy.
quarkus.http.static-resources.caching-enabled=false

# OIDC: bearer-token validation only (application-type=service) - this is a pure SPA +
# JSON API, the Angular app itself handles the login redirect/token acquisition via
# angular-oauth2-oidc, so Quarkus never needs to do server-side redirects.
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated
# /api/auth-config must stay public - the frontend fetches it before it has a token.
# /api/public/* is the deliberately-unauthenticated collection overview page (current
# collection's progress + how to pay) - see PublicOverviewResource's javadoc for why.
quarkus.http.auth.permission.public.paths=/api/auth-config,/api/public/*
quarkus.http.auth.permission.public.policy=permit
# /internal/* is NOT part of /api/* and therefore not covered by quarkus-oidc at all -
# it's meant to be hit by AWS EventBridge Scheduler in prod, not by a logged-in parent's
# browser. It's protected by its own shared-secret header check inside
# BankStatementPollResource, not by Cognito/Keycloak - see bankstatement adapter.in.scheduler
# and CLAUDE.md ("Why EventBridge instead of @Scheduled in Lambda").
quarkus.http.auth.permission.internal.paths=/internal/*
quarkus.http.auth.permission.internal.policy=permit

quarkus.oidc.application-type=service
quarkus.oidc.client-id=${OIDC_CLIENT_ID:local-dev-client}
# quarkus.oidc.auth-server-url is intentionally unset here - leaving it unset in dev mode
# is what makes Dev Services auto-start a local Keycloak. In AWS it's supplied via the
# QUARKUS_OIDC_AUTH_SERVER_URL Lambda env var, pointing at the Cognito User Pool's issuer.
quarkus.keycloak.devservices.realm-path=keycloak-realm.json

quarkus.dynamodb.aws.region=eu-central-1
quarkus.dynamodb.aws.credentials.type=default

quarkus.s3.aws.region=eu-central-1
quarkus.s3.aws.credentials.type=default

# Single-table design (pk/sk) - see DynamoDbTableInitializer for the key layout and why
# this differs from turboorders' single-hash-key table. In AWS this must match
# aws_dynamodb_table.app.name in infra/main/main.tf.
groszdogrosza.dynamodb.table-name=groszdogrosza

# The Cognito User Pool parent login accounts get created in - see
# parent.adapter.out.cognito.CognitoAccountManagementAdapter. Empty in dev (local dev uses
# Keycloak, not Cognito, so this feature has nothing to call there), set via
# GROSZDOGROSZA_COGNITO_USER_POOL_ID in prod to aws_cognito_user_pool.app.id.
groszdogrosza.cognito.user-pool-id=

# --- bankstatement: Gmail IMAP polling (mBank daily statement mail) ---
# Deliberately left empty in the repo - never commit a real App Password. Set via env vars
# (GROSZDOGROSZA_BANKSTATEMENT_IMAP_*) locally or as Lambda env vars in prod. See CLAUDE.md
# for why IMAP + a Gmail App Password was chosen over the full Gmail API OAuth consent flow.
groszdogrosza.bankstatement.imap.host=imap.gmail.com
groszdogrosza.bankstatement.imap.port=993
groszdogrosza.bankstatement.imap.username=
groszdogrosza.bankstatement.imap.app-password=
groszdogrosza.bankstatement.imap.mailbox=INBOX
# Sender the mBank daily statement mail actually comes from - narrows the IMAP search so
# an unrelated inbox message never gets parsed as a bank statement. Confirmed against a
# real raw .eml's "From: mBank <kontakt@mbank.pl>" header (also passes SPF/DKIM/DMARC).
groszdogrosza.bankstatement.imap.expected-sender=kontakt@mbank.pl

# Shared secret EventBridge Scheduler must send as the "X-Poll-Secret" header when calling
# POST /internal/bankstatement/poll in prod. Empty by default (dev mode falls back to the
# @Scheduled poller below, which never goes through this endpoint at all).
groszdogrosza.bankstatement.poll-secret=

# When true, a poll cycle still fetches mail, parses it, and runs matching (so connectivity
# and matching can be observed in the logs) but stops short of actually booking anything -
# no piggy bank credit/debit, no Contribution, no ledger entry, and the matched transaction
# is deliberately NOT marked as processed (see ProcessedTransactionRepositoryPort), so the
# very same transaction shows up again as "would book" on every subsequent poll rather than
# silently disappearing. Set via GROSZDOGROSZA_BANKSTATEMENT_DRY_RUN=true in prod (main.tf) -
# turned on for the first real mBank notifications until the matching/parsing logic has been
# proven against genuine mail (see CLAUDE.md's TODO #2). Left false here so local dev/tests
# (e.g. the e2e suite, which never exercises this pipeline against GreenMail through an
# automated test but relies on the same default) keep booking for real.
groszdogrosza.bankstatement.dry-run=false

# Dev-mode-only convenience: fires BankStatementPoller on a fixed interval so local
# development doesn't require manually curling /internal/bankstatement/poll. This
# @Scheduled method is annotated %dev-only (see BankStatementDevPoller) - it must NEVER
# run in the packaged Lambda, because Lambda has no long-running process for Quarkus's
# scheduler to tick in between invocations (see CLAUDE.md, "Why EventBridge instead of
# @Scheduled in Lambda").
%dev.groszdogrosza.bankstatement.dev-poll-interval=PT5M

# --- collection attachments (photos/receipts documenting what money was spent on) ---
# In AWS this must match aws_s3_bucket.attachments.bucket in infra/main/main.tf. In dev
# mode S3BucketInitializer creates a bucket by this exact name in the shared Dev Services
# Localstack container.
groszdogrosza.attachments.bucket-name=groszdogrosza-attachments

# --- collection / parent matching thresholds ---
# Minimum normalized-name similarity (0.0-1.0) for ParentMatchingPolicy to accept an
# automatic match. Deliberately high - a false positive here means crediting the wrong
# parent's piggy bank with real money, which is far worse than occasionally failing to
# auto-match a transaction with a typo'd sender name (which just needs a manual look).
groszdogrosza.bankstatement.matching.min-confidence=0.90
